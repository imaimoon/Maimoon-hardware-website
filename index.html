<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b2e">
  <meta name="description" content="Maimoon Hardware — Your trusted industrial hardware partner in Dhaka, Bangladesh. Our new website is coming soon.">
  <title>Maimoon Hardware | Coming Soon</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root { color-scheme: dark; --navy:#080b2e; --blue:#171c68; --ink:#f7f8ff; --muted:#b9bdd6; }
    * { box-sizing: border-box; }
    body {
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:32px 20px;

  background:
    radial-gradient(ellipse at 50% 35%, rgba(36,48,130,.055), transparent 58%),
    #ffffff;
}
    main { width:min(100%,900px); text-align:center; }
    .panel {
      padding:clamp(34px,7vw,76px) clamp(22px,6vw,64px);
      border:1px solid rgba(255,255,255,.12); border-radius:24px;
      background:rgba(255,255,255,.035); box-shadow:0 28px 90px rgba(0,0,0,.28);
      backdrop-filter:blur(8px);
    }
    .logo { display:block; width:min(100%,760px); height:auto; margin:0 auto 48px; }
    .eyebrow { color:#aeb5ff; font-size:12px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
    h1 { color:#aeb5ff; margin:16px 0 14px; font-size:clamp(34px,6vw,58px); line-height:1.06; letter-spacing:-.045em; }
    p { max-width:590px; margin:0 auto; color:var(--muted); font-size:clamp(15px,2vw,18px); line-height:1.75; }
    .rule { width:54px; height:3px; border-radius:3px; margin:30px auto; background:#555ee8; }
    .tagline { color:#eef0ff; font-size:14px; font-weight:600; letter-spacing:.04em; }
    footer { margin-top:26px; color:#858ba9; font-size:12px; letter-spacing:.04em; }
    @media (max-width:520px) { .logo { margin-bottom:38px; } .panel { border-radius:18px; } }
  </style>
  <link rel="icon" href="/favicon.ico" sizes="any">
</head>
<body>
  <main>
    <section class="panel" aria-label="Maimoon Hardware coming soon">
      <img class="logo" src="logo.png" alt="Maimoon Hardware">
      <div class="eyebrow">A new digital experience is on its way</div>
      <h1>Our website is coming soon.</h1>
      <p>We’re working on a new online home for Maimoon Hardware. Please check back soon to explore our products and services.</p>
      <div class="rule"></div>
      <div class="tagline">Your Trusted Industrial Hardware Partner</div>
    </section>
    <footer>© <span id="year"></span> Maimoon Hardware · Dhaka, Bangladesh</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
